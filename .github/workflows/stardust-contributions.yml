name: Create stardust contribution trail

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stardust-contributions.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the stardust renderer
        uses: actions/checkout@v4

      - name: Draw the contribution trail
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/stardust-contribution-trail.svg?palette=github-light&color_snake=%23e879a9&color_dots=%23f7edf3,%23f1c9dc,%23e99abd,%23dc6f9f,%23bd3f7f
            dist/stardust-contribution-trail-dark.svg?palette=github-dark&color_snake=%23f9a8d4&color_dots=%230d1117,%23321b2b,%23613251,%23a14a79,%23e879a9

      - name: Turn contributions into stardust
        run: node scripts/stardustify-contributions.mjs

      - name: Publish generated art
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
